name: Build

on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:
    branches: [main, master]
  workflow_dispatch:

env:
  GO_VERSION: '1.25.0'

permissions:
  contents: read

jobs:
  test:
    name: Test
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Cache Go modules
        uses: actions/cache@v4
        with:
          path: ~/go/pkg/mod
          key: ${{ runner.os }}-go-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-

      - name: Download dependencies
        run: go mod download

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          # Two cgo consumers with different deps:
          # - wails3 CLI (alpha.95): gtk4 + webkitgtk-6.0
          # - wails v3 lib (alpha.63, compiled via internal/gui in tests): gtk3 + webkit2gtk-4.1
          sudo apt-get install -y libgtk-4-dev libwebkitgtk-6.0-dev \
            libgtk-3-dev libwebkit2gtk-4.1-dev libsoup-3.0-dev libayatana-appindicator3-dev \
            build-essential pkg-config npm

      - name: Install wails3 CLI
        run: |
          go install github.com/wailsapp/wails/v3/cmd/wails3@v3.0.0-alpha.95
          echo "$HOME/go/bin" >> $GITHUB_PATH

      - name: Generate Wails bindings
        shell: bash
        run: |
          # ChatService is registered in cmd/gline-gui ('gui' build tag).
          wails3 generate bindings -f "-tags gui" --ts -d frontend/bindings ./cmd/gline-gui

      - name: Install frontend dependencies
        run: cd frontend && npm install

      - name: Build frontend
        run: cd frontend && node ./node_modules/typescript/bin/tsc && node ./node_modules/vite/bin/vite.js build --mode production

      # Sync frontend build output into the standalone GUI entry (gline-gui
      # embeds it via //go:embed all:frontend/dist; the CLI no longer embeds).
      - name: Sync frontend to GUI embed directories
        shell: bash
        run: |
          mkdir -p cmd/gline-gui/frontend/dist
          rm -rf cmd/gline-gui/frontend/dist
          cp -r frontend/dist cmd/gline-gui/frontend/dist
          mkdir -p cmd/gline-gui/build
          cp -f cmd/gline/build/appicon.png cmd/gline-gui/build/appicon.png

      - name: Run tests
        run: go test -v ./...

      - name: Run vet
        run: go vet ./...

  build:
    name: Build (${{ matrix.name }})
    needs: test
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # macOS Apple Silicon
          - name: darwin-arm64
            runner: macos-latest
          # Windows AMD64
          - name: windows-amd64
            runner: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Cache Go modules
        uses: actions/cache@v4
        with:
          path: ~/go/pkg/mod
          key: ${{ runner.os }}-${{ runner.arch }}-go-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-go-

      - name: Install wails3 CLI
        run: |
          go install github.com/wailsapp/wails/v3/cmd/wails3@v3.0.0-alpha.95
          echo "$HOME/go/bin" >> $GITHUB_PATH
        shell: bash

      - name: Generate Wails bindings
        shell: bash
        run: |
          # ChatService is registered in cmd/gline-gui ('gui' build tag).
          wails3 generate bindings -f "-tags gui" --ts -d frontend/bindings ./cmd/gline-gui

      - name: Install frontend dependencies
        run: cd frontend && npm install

      - name: Build frontend
        run: cd frontend && node ./node_modules/typescript/bin/tsc && node ./node_modules/vite/bin/vite.js build --mode production

      - name: Build Go binary
        shell: bash
        run: |
          # Extract version: use tag name for tag pushes, otherwise use git describe
          if [[ "${{ github.ref }}" == refs/tags/* ]]; then
            version="${{ github.ref_name }}"
          else
            version=$(git describe --tags --always --dirty 2>/dev/null || echo "dev")
          fi
          commit=$(git rev-parse --short HEAD 2>/dev/null || echo "unknown")
          build_time=$(date -u '+%Y-%m-%d_%H:%M:%S' 2>/dev/null || date)
          ldflags_base="-X github.com/liup215/gline/internal/version.Version=$version -X github.com/liup215/gline/internal/version.Commit=$commit -X github.com/liup215/gline/internal/version.BuildTime=$build_time -s -w"
          mkdir -p bin
          binary="bin/gline"
          echo "Building version: $version (commit: $commit)"
          if [[ "${{ matrix.name }}" == windows-* ]]; then
            # Console subsystem: the CLI runs the Bubbletea TUI, which opens
            # CONIN$ directly — invalid for a windowsgui-subsystem process.
            GOOS=windows GOARCH=amd64 CGO_ENABLED=0 go build -ldflags "$ldflags_base" -o "${binary}.exe" ./cmd/gline
            # GUI: Wails v3 on Windows is pure syscall (no cgo). windowsgui
            # subsystem keeps the terminal window hidden.
            GOOS=windows GOARCH=amd64 CGO_ENABLED=0 go build -tags gui -ldflags "$ldflags_base -H=windowsgui" -o "bin/gline-gui.exe" ./cmd/gline-gui
          else
            # macOS requires CGO for Wails WebKit bindings
            go build -ldflags "$ldflags_base" -o "$binary" ./cmd/gline
            go build -tags gui -ldflags "$ldflags_base" -o "bin/gline-gui" ./cmd/gline-gui
          fi

      - name: Rename & generate checksum
        shell: bash
        run: |
          asset_name="gline-${{ matrix.name }}"
          gui_asset_name="gline-gui-${{ matrix.name }}"
          cd bin
          if [[ "${{ matrix.name }}" == windows-* ]]; then
            mv gline.exe "${asset_name}.exe"
            mv gline-gui.exe "${gui_asset_name}.exe"
            sha256sum "${asset_name}.exe" > "${asset_name}.sha256"
            sha256sum "${gui_asset_name}.exe" > "${gui_asset_name}.sha256"
            cat "${asset_name}.sha256" "${gui_asset_name}.sha256"
          else
            mv gline "$asset_name"
            mv gline-gui "$gui_asset_name"
            sha256sum "$asset_name" > "${asset_name}.sha256"
            sha256sum "$gui_asset_name" > "${gui_asset_name}.sha256"
            cat "${asset_name}.sha256" "${gui_asset_name}.sha256"
          fi

      - name: Upload binaries
        uses: actions/upload-artifact@v4
        with:
          name: gline-${{ matrix.name }}
          # gline-{name}* (CLI) + gline-gui-{name}* (GUI) + *.sha256
          path: bin/gline*
          if-no-files-found: error

  build-summary:
    name: Build Summary
    needs: build
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          pattern: gline-*

      - name: List artifacts
        shell: bash
        run: |
          echo "Build artifacts:"
          find artifacts -type f | sort

      - name: Summary
        run: |
          echo "## Build Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Platform | Architecture | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|----------|-------------|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| macOS    | ARM64 (CLI + GUI) | ✅ |" >> $GITHUB_STEP_SUMMARY
          echo "| Windows  | AMD64 (CLI + GUI) | ✅ |" >> $GITHUB_STEP_SUMMARY

  release:
    name: Create Release
    needs: build
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          pattern: gline-*

      - name: Prepare release files
        shell: bash
        run: |
          mkdir -p release
          # All CLI + GUI binaries and their .sha256 files share the gline* prefix.
          find artifacts -type f -name "gline*" -exec cp {} release/ \;
          cd release
          ls -la
          # Checksum every binary (CLI + GUI); skip the .sha256 sidecar files
          # themselves. Sort for deterministic ordering.
          find . -maxdepth 1 -type f -name "gline*" ! -name "*.sha256" | sed 's|^\./||' | sort | xargs sha256sum > SHA256SUMS
          cat SHA256SUMS

      - name: Generate changelog
        id: changelog
        shell: bash
        run: |
          VERSION=${GITHUB_REF#refs/tags/}
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          PREVIOUS_TAG=$(git describe --tags --abbrev=0 HEAD~1 2>/dev/null || echo "")
          if [ -z "$PREVIOUS_TAG" ]; then
            CHANGELOG=$(git log --pretty=format:"- %s" --no-merges)
          else
            CHANGELOG=$(git log --pretty=format:"- %s" --no-merges "$PREVIOUS_TAG..HEAD")
          fi
          echo "changelog<<EOF" >> $GITHUB_OUTPUT
          echo "$CHANGELOG" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          name: Release ${{ steps.changelog.outputs.version }}
          body: |
            ## Changes in ${{ steps.changelog.outputs.version }}

            ${{ steps.changelog.outputs.changelog }}

            ## Installation

            ### macOS (Apple Silicon)
            ```bash
            curl -L -o gline-darwin-arm64 https://github.com/${{ github.repository }}/releases/download/${{ steps.changelog.outputs.version }}/gline-darwin-arm64
            chmod +x gline-darwin-arm64
            sudo mv gline-darwin-arm64 /usr/local/bin/gline
            ```
            > Note: Intel Mac (amd64) users can build from source: `go build ./cmd/gline`

            ### Windows (CLI)
            Download `gline-windows-amd64.exe` and place it in your PATH.

            ### Windows (GUI desktop app)
            Download `gline-gui-windows-amd64.exe` and run it directly.

            ### macOS (GUI desktop app)
            Download `gline-gui-darwin-arm64`, then run:
            ```bash
            chmod +x gline-gui-darwin-arm64
            xattr -d com.apple.quarantine gline-gui-darwin-arm64  # unsigned build, bypass Gatekeeper
            ./gline-gui-darwin-arm64
            ```

            ## Checksums
            See `SHA256SUMS` file for checksums of all binaries.
          files: release/*
          draft: false
          prerelease: ${{ contains(github.ref, '-rc') || contains(github.ref, '-beta') || contains(github.ref, '-alpha') }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  snapshot:
    name: Create Snapshot Release
    needs: build
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          pattern: gline-*

      - name: Prepare release files
        shell: bash
        run: |
          mkdir -p release
          # All CLI + GUI binaries and their .sha256 files share the gline* prefix.
          find artifacts -type f -name "gline*" -exec cp {} release/ \;
          cd release
          ls -la
          # Checksum every binary (CLI + GUI); skip the .sha256 sidecar files
          # themselves. Sort for deterministic ordering.
          find . -maxdepth 1 -type f -name "gline*" ! -name "*.sha256" | sed 's|^\./||' | sort | xargs sha256sum > SHA256SUMS
          cat SHA256SUMS

      - name: Generate changelog
        id: changelog
        shell: bash
        run: |
          VERSION=$(git describe --tags --always --dirty 2>/dev/null || echo "dev")
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          PREVIOUS_TAG=$(git describe --tags --abbrev=0 HEAD~1 2>/dev/null || echo "")
          if [ -z "$PREVIOUS_TAG" ]; then
            CHANGELOG=$(git log --pretty=format:"- %s" --no-merges)
          else
            CHANGELOG=$(git log --pretty=format:"- %s" --no-merges "$PREVIOUS_TAG..HEAD")
          fi
          echo "changelog<<EOF" >> $GITHUB_OUTPUT
          echo "$CHANGELOG" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Create Snapshot Release
        uses: softprops/action-gh-release@v2
        with:
          name: "Snapshot ${{ steps.changelog.outputs.version }}"
          body: |
            ## Snapshot Build ${{ steps.changelog.outputs.version }}

            ${{ steps.changelog.outputs.changelog }}

            ## Installation

            ### macOS (Apple Silicon)
            ```bash
            curl -L -o gline-darwin-arm64 https://github.com/${{ github.repository }}/releases/download/snapshot/gline-darwin-arm64
            chmod +x gline-darwin-arm64
            sudo mv gline-darwin-arm64 /usr/local/bin/gline
            ```

            ### Windows (CLI)
            Download `gline-windows-amd64.exe` and place it in your PATH.

            ### Windows (GUI desktop app)
            Download `gline-gui-windows-amd64.exe` and run it directly.

            ### macOS (GUI desktop app)
            Download `gline-gui-darwin-arm64`, then run:
            ```bash
            chmod +x gline-gui-darwin-arm64
            xattr -d com.apple.quarantine gline-gui-darwin-arm64  # unsigned build, bypass Gatekeeper
            ./gline-gui-darwin-arm64
            ```
          files: release/*
          draft: false
          prerelease: true
          tag_name: snapshot
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
